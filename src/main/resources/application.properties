spring.application.name=sepisac-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}
jwt.cookie.name=${COOKIE_NAME:jwt_token}
jwt.cookie.secure=${COOKIE_SECURE:false}
jwt.cookie.same-site=${COOKIE_SAME_SITE:Lax}
jwt.cookie.path=${COOKIE_PATH:/}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
springdoc.api-docs.enabled=${SWAGGER_ENABLED}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.email=${MAIL_FROM:${spring.mail.username:}}