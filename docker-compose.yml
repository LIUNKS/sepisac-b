services:
  sepisac-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sepisac-backend:latest
    container_name: sepisac-backend-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - SERVER_PORT=8080
